name: Real-time data sync (sheet edit)

# Triggered by the Google Sheet's onEdit webhook (public repository_dispatch URL).
# Rebuilds data.js from the sheets and deploys - so a new row in the sheet shows
# up on the dashboard within ~1 minute, no hourly wait.
# The webhook URL is PUBLIC and carries NO secret; the repo secret GH_PAT (used
# below to push) is stored only in GitHub repo settings, never in the sheet.

on:
  repository_dispatch:
    types: [sheet-updated]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pip install --quiet openpyxl
      - name: Download both sheets
        working-directory: tools
        env:
          PERF_SHEET_ID: ${{ secrets.PERF_SHEET_ID }}
          SCHED_SHEET_ID: ${{ secrets.SCHED_SHEET_ID }}
        run: python fetch.py
      - name: Convert sheets to grids
        working-directory: tools
        run: python togrid.py
      - name: Run the parsers
        working-directory: tools
        run: node mkmock.js
      - name: Bake data.js
        run: node tools/bake.js
      - name: Sanity-check the result
        run: node tools/checkdata.js
      - name: Bump cache-buster ONLY when data.js changed
        run: |
          if git diff --quiet -- data.js; then
            echo "data.js unchanged - leaving ?v as-is"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const p = "index.html";
            let s = fs.readFileSync(p, "utf8");
            s = s.replace(/(\?v=)(\d+)/g, (_, pre, n) => pre + (parseInt(n, 10) + 1));
            fs.writeFileSync(p, s);
            console.log("bumped ?v in index.html (data changed)");
          '
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.js index.html; then
            echo "data.js/index.html unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html
          git commit -m "Realtime sync: rebuild data.js ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
